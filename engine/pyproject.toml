[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docforge-engine"
version = "0.1.0"
description = "Offline Python sidecar engine for DocForge Desktop"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
pdf = ["pymupdf", "pymupdf4llm", "pypdf", "pikepdf", "pydantic>=2", "pillow", "openpyxl", "pywin32>=306; sys_platform == 'win32'"]
office = ["pywin32>=306; sys_platform == 'win32'"]
docling = ["docling", "docling-core"]
dev = ["pytest", "pyinstaller"]

[project.scripts]
docforge-engine = "docforge_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["docforge_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::FutureWarning:fitz",
]
